services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d academic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/auth-service:${IMAGE_TAG:-prod}
    container_name: eduportal-auth-prod
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx120m -Xms40m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 220M

  course-service:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/course-service:${IMAGE_TAG:-prod}
    container_name: eduportal-course-prod
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx120m -Xms40m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 220M

  enrollment-service:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/enrollment-service:${IMAGE_TAG:-prod}
    container_name: eduportal-enrollment-prod
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-57fb1006-9ba1-472c-ba21-8536efcda5aa}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-22f2d865-a236-4f93-9f66-e845a1dae134}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-2fcea1152bb41c61979f7011cc5a0e3b72758cc9d14909772595a5268dc9075a}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-https://rikkeiportal.io.vn/student/tuition?status=PAID}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-https://rikkeiportal.io.vn/student/tuition?status=CANCELLED}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx120m -Xms40m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 220M

  lecturer-service:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/lecturer-service:${IMAGE_TAG:-prod}
    container_name: eduportal-lecturer-prod
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx120m -Xms40m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 220M

  ai-service:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/ai-service:${IMAGE_TAG:-prod}
    container_name: eduportal-ai-prod
    restart: always
    ports:
      - "${AI_PORT:-8084}:8084"
    environment:
      AI_API_KEY: ${AI_API_KEY:-demo-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1500}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx120m -Xms40m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      - enrollment-service
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 220M

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/minh2307}/frontend:${IMAGE_TAG:-prod}
    container_name: eduportal-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - auth-service
      - lecturer-service
      - enrollment-service
      - ai-service
      - course-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

volumes:
  postgres_prod_data:
