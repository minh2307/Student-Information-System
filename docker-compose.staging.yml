services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres-staging
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d academic_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    image: ${IMAGE_PREFIX}/auth-service:${IMAGE_TAG}
    container_name: eduportal-auth-staging
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SPRING_PROFILES_ACTIVE: staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  lecturer-service:
    image: ${IMAGE_PREFIX}/lecturer-service:${IMAGE_TAG}
    container_name: eduportal-lecturer-staging
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  enrollment-service:
    image: ${IMAGE_PREFIX}/enrollment-service:${IMAGE_TAG}
    container_name: eduportal-enrollment-staging
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    container_name: eduportal-frontend-staging
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - lecturer-service
      - enrollment-service
    restart: unless-stopped

volumes:
  postgres_data_staging:
