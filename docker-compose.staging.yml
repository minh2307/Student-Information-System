name: eduportal-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-academic_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-academic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 160M
        reservations:
          memory: 48M
    networks:
      - staging-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-auth-service:${IMAGE_TAG:-latest}
    container_name: eduportal-auth-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT:-18081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-academic_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-localhost,127.0.0.1}
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-course-service:${IMAGE_TAG:-latest}
    container_name: eduportal-course-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COURSE_PORT:-18082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-academic_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-enrollment-service:${IMAGE_TAG:-latest}
    container_name: eduportal-enrollment-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ENROLLMENT_PORT:-18083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-academic_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-57fb1006-9ba1-472c-ba21-8536efcda5aa}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-22f2d865-a236-4f93-9f66-e845a1dae134}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-2fcea1152bb41c61979f7011cc5a0e3b72758cc9d14909772595a5268dc9075a}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-https://rikkeiportal.io.vn/student/tuition?status=PAID}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-https://rikkeiportal.io.vn/student/tuition?status=CANCELLED}
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-ai-service:${IMAGE_TAG:-latest}
    container_name: eduportal-ai-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT:-18084}:8084"
    environment:
      AI_API_KEY: ${AI_API_KEY:-demo-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1500}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      enrollment-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  lecturer-service:
    build:
      context: .
      dockerfile: services/lecturer-service/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-lecturer-service:${IMAGE_TAG:-latest}
    container_name: eduportal-lecturer-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LECTURER_PORT:-18085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-academic_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-demo-client-id}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-demo-api-key}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-demo-checksum-key-32bytes-long!!}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:8080/student/tuition?status=PAID}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:8080/student/tuition?status=CANCELLED}
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ${IMAGE_PREFIX:-}staging-api-gateway:${IMAGE_TAG:-latest}
    container_name: eduportal-gateway-staging
    restart: unless-stopped
    ports:
      # Secure Loopback Binding: Port 18080 (tránh xung đột với 8080)
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      LECTURER_SERVICE_URL: http://lecturer-service:8085
      AI_SERVICE_URL: http://ai-service:8084
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SPRING_PROFILES_ACTIVE: staging
      JAVA_OPTS: ${JAVA_OPTS:--Xmx80m -Xms32m -Xss256k -XX:MaxMetaspaceSize=65m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=20m}
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      lecturer-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health 2>/dev/null || wget -q --spider http://127.0.0.1:8080/api/v1/auth/login 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 200M
        reservations:
          memory: 64M
    networks:
      - staging-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-}staging-frontend:${IMAGE_TAG:-latest}
    container_name: eduportal-frontend-staging
    restart: unless-stopped
    ports:
      # Secure Loopback Binding: Chuyển sang 13000 để tránh xung đột cổng 8080
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-13000}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      enrollment-service:
        condition: service_started
      lecturer-service:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - staging-network

volumes:
  postgres_data_staging:
    name: eduportal_postgres_data_staging

networks:
  staging-network:
    name: eduportal_staging_network
    driver: bridge
