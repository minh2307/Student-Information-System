name: Docker Publish — Rikkei EduPortal

# ============================================================
# Trigger: Build Docker Images và Publish lên GitHub Container Registry (GHCR)
# - Kích hoạt khi có release/merge hoặc kích hoạt thủ công qua workflow_dispatch
# - Chạy build BE, FE và đẩy 6 images lên GHCR
# ============================================================
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-backend:
    name: 🔨 Backend Build & Package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Init DB schema + seed
        run: |
          sudo apt-get install -y postgresql-client -q
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/01-schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/02-seed-data.sql

      - name: Compile and package
        run: ./gradlew build -x test --no-daemon --parallel

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            services/*/build/libs/*.jar
            !services/*/build/libs/*-plain.jar
          retention-days: 1

  build-frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  docker-publish:
    name: 🐳 Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: auth-service
            context: .
            file: services/auth-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/auth-service/build/libs/auth-service-0.0.1-SNAPSHOT.jar
          - name: course-service
            context: .
            file: services/course-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/course-service/build/libs/course-service-0.0.1-SNAPSHOT.jar
          - name: lecturer-service
            context: .
            file: services/lecturer-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/lecturer-service/build/libs/lecturer-service-0.0.1-SNAPSHOT.jar
          - name: enrollment-service
            context: .
            file: services/enrollment-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/enrollment-service/build/libs/enrollment-service-0.0.1-SNAPSHOT.jar
          - name: ai-service
            context: .
            file: services/ai-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/ai-service/build/libs/ai-service-0.0.1-SNAPSHOT.jar
          - name: frontend
            context: ./frontend
            file: frontend/Dockerfile
            artifact: frontend-dist
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHA=${GITHUB_SHA::7}
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT

      - name: Download backend jars
        if: matrix.service.artifact == 'backend-jars'
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services

      - name: Download frontend dist
        if: matrix.service.artifact == 'frontend-dist'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
