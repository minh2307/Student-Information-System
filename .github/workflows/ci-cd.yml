name: CI/CD Pipeline — Rikkei EduPortal

# ============================================================
# Trigger: push & PR vào 3 nhánh chính
# ============================================================
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

# Tránh pipeline đè nhau trên cùng nhánh/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Global env — ghi đè bằng Secrets ở repo Settings
# ============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# ============================================================
# JOB 1: Build & Unit-test Backend
# ============================================================
jobs:
  build-backend:
    name: 🔨 Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Init DB schema + seed
        run: |
          sudo apt-get install -y postgresql-client -q
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/01-schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/02-seed-data.sql

      - name: Compile (skip tests)
        run: ./gradlew build -x test --no-daemon --parallel

      - name: Run unit tests
        run: >
          ./gradlew test --no-daemon --parallel
          -Pspring.datasource.url=jdbc:postgresql://localhost:5432/academic_db
          -Pspring.datasource.username=postgres
          -Pspring.datasource.password=postgres
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/academic_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: ${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            services/*/build/libs/*.jar
            !services/*/build/libs/*-plain.jar
          retention-days: 1

  # ============================================================
  # JOB 2: Build Frontend
  # ============================================================
  build-frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vite build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # JOB 3: API Tests (Postman/Newman)
  # needs: backend build pass (frontend chạy song song không block)
  # ============================================================
  api-test:
    name: 🧪 API Integration Tests (Newman)
    runs-on: ubuntu-latest
    needs: [build-backend]
    permissions:
      contents: read
      checks: write

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Init DB
        run: |
          sudo apt-get install -y postgresql-client -q
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/01-schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_db \
            -f init-db/02-seed-data.sql

      # Tái sử dụng fat jars đã compile từ job build-backend
      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services

      # Khởi động auth-service (JWT issuance)
      - name: Start auth-service (port 8081)
        run: |
          AUTH_JAR=$(find services/auth-service/ -name "*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          [ -z "$AUTH_JAR" ] && AUTH_JAR=$(find . -name "auth-service*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          if [ -z "$AUTH_JAR" ] || [ ! -f "$AUTH_JAR" ]; then
            echo "❌ Cannot find auth-service JAR! Workspace jars:"
            find . -name "*.jar"
            exit 1
          fi
          echo "Starting auth-service with jar: $AUTH_JAR"
          nohup java -jar "$AUTH_JAR" \
            --server.port=8081 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/academic_db \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --spring.jpa.hibernate.ddl-auto=validate \
            --jwt.secret=${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }} \
            > /tmp/auth-service.log 2>&1 &
          echo "AUTH_PID=$!" >> $GITHUB_ENV

      # Khởi động lecturer-service (chủ thể test chính)
      - name: Start lecturer-service (port 8085)
        run: |
          LECTURER_JAR=$(find services/lecturer-service/ -name "*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          [ -z "$LECTURER_JAR" ] && LECTURER_JAR=$(find . -name "lecturer-service*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          if [ -z "$LECTURER_JAR" ] || [ ! -f "$LECTURER_JAR" ]; then
            echo "❌ Cannot find lecturer-service JAR! Workspace jars:"
            find . -name "*.jar"
            exit 1
          fi
          echo "Starting lecturer-service with jar: $LECTURER_JAR"
          nohup java -jar "$LECTURER_JAR" \
            --server.port=8085 \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/academic_db \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --spring.jpa.hibernate.ddl-auto=validate \
            --jwt.secret=${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }} \
            > /tmp/lecturer-service.log 2>&1 &
          echo "LECTURER_PID=$!" >> $GITHUB_ENV

      # Khởi động enrollment-service (nếu jar tồn tại — merge với Quân)
      - name: Start enrollment-service (port 8083) — optional
        run: |
          ENROLL_JAR=$(find services/enrollment-service/ -name "*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          [ -z "$ENROLL_JAR" ] && ENROLL_JAR=$(find . -name "enrollment-service*.jar" 2>/dev/null | grep -v 'plain' | head -n 1)
          if [ -n "$ENROLL_JAR" ] && [ -f "$ENROLL_JAR" ]; then
            echo "Starting enrollment-service with jar: $ENROLL_JAR"
            nohup java -jar "$ENROLL_JAR" \
              --server.port=8083 \
              --spring.datasource.url=jdbc:postgresql://localhost:5432/academic_db \
              --spring.datasource.username=postgres \
              --spring.datasource.password=postgres \
              --spring.jpa.hibernate.ddl-auto=validate \
              --jwt.secret=${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }} \
              > /tmp/enrollment-service.log 2>&1 &
            echo "ENROLLMENT_PID=$!" >> $GITHUB_ENV
            echo "HAS_ENROLLMENT=true" >> $GITHUB_ENV
          else
            echo "enrollment-service jar not found, skipping."
            echo "HAS_ENROLLMENT=false" >> $GITHUB_ENV
          fi

      # Chờ services sẵn sàng (polling /actuator/health)
      - name: Wait for services to be ready
        run: |
          echo "Waiting for auth-service:8081..."
          AUTH_READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1 || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/v1/auth/login)" = "405" ]; then
              echo "auth-service ready ✓"; AUTH_READY=true; break
            fi
            sleep 3
          done
          if [ "$AUTH_READY" != "true" ]; then
            echo "❌ auth-service failed to start! Dumping log:"
            cat /tmp/auth-service.log || true
            exit 1
          fi

          echo "Waiting for lecturer-service:8085..."
          LECTURER_READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8085/actuator/health > /dev/null 2>&1; then
              echo "lecturer-service ready ✓"; LECTURER_READY=true; break
            fi
            sleep 3
          done
          if [ "$LECTURER_READY" != "true" ]; then
            echo "❌ lecturer-service failed to start! Dumping log:"
            cat /tmp/lecturer-service.log || true
            exit 1
          fi

          if [ "$HAS_ENROLLMENT" = "true" ]; then
            echo "Waiting for enrollment-service:8083..."
            ENROLL_READY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8083/actuator/health > /dev/null 2>&1 || [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8083/api/v1/student/dashboard)" = "200" ]; then
                echo "enrollment-service ready ✓"; ENROLL_READY=true; break
              fi
              sleep 3
            done
            if [ "$ENROLL_READY" != "true" ]; then
              echo "❌ enrollment-service failed to start! Dumping log:"
              cat /tmp/enrollment-service.log || true
              exit 1
            fi
          fi

      - name: Setup Node.js (Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm packages (Newman)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-newman-cache-v1
          restore-keys: |
            ${{ runner.os }}-newman-cache-

      - name: Install Newman + reporters
        run: npm install -g --prefer-offline newman newman-reporter-htmlextra

      # Chạy test collection
      - name: Run Postman/Newman API tests
        run: |
          newman run postman/eduportal.postman_collection.json \
            -e postman/ci.postman_environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export /tmp/newman-results/junit.xml \
            --reporter-htmlextra-export /tmp/newman-results/report.html \
            --bail \
            --timeout-request 15000
        env:
          NEWMAN_BASE_AUTH_URL: http://localhost:8081
          NEWMAN_BASE_LECTURER_URL: http://localhost:8085
          NEWMAN_BASE_ENROLLMENT_URL: http://localhost:8083

      # Upload kết quả dù pass hay fail
      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: /tmp/newman-results/
          retention-days: 14

      # Publish JUnit results vào GitHub UI
      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: /tmp/newman-results/junit.xml

      # Debug log nếu fail
      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== auth-service.log ===" && tail -50 /tmp/auth-service.log || true
          echo "=== lecturer-service.log ===" && tail -50 /tmp/lecturer-service.log || true
          echo "=== enrollment-service.log ===" && tail -50 /tmp/enrollment-service.log || true

  # ============================================================
  # JOB 4: Docker Build & Push to GHCR (Song song hóa qua Matrix)
  # Chỉ chạy khi push (không chạy cho PR)
  # ============================================================
  docker-publish:
    name: 🐳 Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [api-test, build-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: auth-service
            context: .
            file: services/auth-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/auth-service/build/libs/auth-service-0.0.1-SNAPSHOT.jar
          - name: lecturer-service
            context: .
            file: services/lecturer-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/lecturer-service/build/libs/lecturer-service-0.0.1-SNAPSHOT.jar
          - name: enrollment-service
            context: .
            file: services/enrollment-service/Dockerfile
            artifact: backend-jars
            build_args: JAR_FILE=services/enrollment-service/build/libs/enrollment-service-0.0.1-SNAPSHOT.jar
          - name: frontend
            context: ./frontend
            file: frontend/Dockerfile
            artifact: frontend-dist
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHA=${GITHUB_SHA::7}
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT

      - name: Download backend jars
        if: matrix.service.artifact == 'backend-jars'
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: services

      - name: Download frontend dist
        if: matrix.service.artifact == 'frontend-dist'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ============================================================
  # JOB 5: Deploy — map nhánh → môi trường
  # ============================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # Resolve environment theo nhánh
    environment:
      name: >-
        ${{
          github.ref_name == 'main'    && 'production'  ||
          github.ref_name == 'staging' && 'staging'     ||
          'development'
        }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve compose file & env
        id: resolve
        run: |
          case "${GITHUB_REF_NAME}" in
            main)    ENV_NAME="prod"    ; COMPOSE_FILE="docker-compose.prod.yml"    ; FRONTEND_PORT="80"   ;;
            staging) ENV_NAME="staging" ; COMPOSE_FILE="docker-compose.staging.yml" ; FRONTEND_PORT="3000" ;;
            *)       ENV_NAME="dev"     ; COMPOSE_FILE="docker-compose.dev.yml"     ; FRONTEND_PORT="3000" ;;
          esac
          echo "env_name=${ENV_NAME}"           >> $GITHUB_OUTPUT
          echo "compose_file=${COMPOSE_FILE}"   >> $GITHUB_OUTPUT
          echo "frontend_port=${FRONTEND_PORT}" >> $GITHUB_OUTPUT
          echo "tag=$(echo ${GITHUB_REF_NAME} | tr '/' '-')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '221.121.3.201' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::Secret SSH_KEY chưa được cấu hình trong GitHub Secrets. Bỏ qua bước Deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          python3 -c "
          import os, re, base64
          raw = os.environ.get('SSH_KEY', '').strip()
          if '-----BEGIN' not in raw:
              try:
                  dec = base64.b64decode(raw).decode('utf-8', errors='ignore')
                  if '-----BEGIN' in dec:
                      raw = dec
              except Exception:
                  pass
          raw = raw.replace('\\\\n', '\n').replace('\r', '')
          m = re.search(r'(-----BEGIN [A-Z0-9 ]+ PRIVATE KEY-----)(.*?)(-----END [A-Z0-9 ]+ PRIVATE KEY-----)', raw, re.DOTALL)
          if m:
              header = m.group(1).strip()
              body = m.group(2).replace(' ', '').replace('\n', '')
              footer = m.group(3).strip()
              formatted = '\n'.join([body[i:i+64] for i in range(0, len(body), 64)])
              clean = f'{header}\n{formatted}\n{footer}\n'
          else:
              clean = raw.strip() + '\n'
          with open(os.path.expanduser('~/.ssh/deploy_key'), 'w') as f:
              f.write(clean)
          "
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH private key không đúng định dạng OpenSSH/PEM! Vui lòng kiểm tra lại secret SSH_KEY."
            rm -f ~/.ssh/deploy_key
            exit 1
          fi
          echo "SSH deploy key loaded successfully ✓"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '221.121.3.201' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://openrouter.ai/api' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'google/gemini-2.5-flash' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openrouter' }}
          AI_MAX_TOKENS: '1500'
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || steps.resolve.outputs.frontend_port }}
          FRONTEND_ALT_PORT: ${{ vars.FRONTEND_ALT_PORT || '3000' }}
          COMPOSE_FILE: ${{ steps.resolve.outputs.compose_file }}
          ENV_NAME: ${{ steps.resolve.outputs.env_name }}
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "Bo qua Deploy vi khong co SSH key."
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p /opt/eduportal"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            docker-compose*.yml init-db .github/scripts/remote-deploy.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/eduportal/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "COMPOSE_FILE='${COMPOSE_FILE}' ENV_NAME='${ENV_NAME}' IMAGE_TAG='${IMAGE_TAG}' REGISTRY='${REGISTRY}' IMAGE_PREFIX='${IMAGE_PREFIX}' DB_PASSWORD='${DB_PASSWORD}' JWT_SECRET='${JWT_SECRET}' AI_API_KEY='${AI_API_KEY}' AI_BASE_URL='${AI_BASE_URL}' AI_MODEL='${AI_MODEL}' AI_PROVIDER='${AI_PROVIDER}' AI_MAX_TOKENS='${AI_MAX_TOKENS}' FRONTEND_PORT='${FRONTEND_PORT}' FRONTEND_ALT_PORT='${FRONTEND_ALT_PORT}' bash /opt/eduportal/remote-deploy.sh"

      - name: Notify deploy result
        if: always()
        run: |
          echo "Deploy to ${{ steps.resolve.outputs.env_name }} → ${{ job.status }}"
          echo "Image tag: ${{ steps.resolve.outputs.tag }}"
          echo "Compose file: ${{ steps.resolve.outputs.compose_file }}"
