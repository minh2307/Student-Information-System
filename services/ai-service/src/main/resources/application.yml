server:
  port: 8084

spring:
  application:
    name: ai-service
  ai:
    openai:
      api-key: ${AI_API_KEY:${GEMINI_API_KEY:demo-key}}
      base-url: ${AI_BASE_URL:${GEMINI_BASE_URL:https://openrouter.ai/api}}
      chat:
        options:
          model: ${AI_MODEL:${GEMINI_MODEL:google/gemini-2.5-flash}}
          temperature: 0.7
          max-tokens: ${AI_MAX_TOKENS:1500}

gemini:
  api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
  base-url: ${AI_BASE_URL:${GEMINI_BASE_URL:https://openrouter.ai/api}}
  model: ${AI_MODEL:${GEMINI_MODEL:google/gemini-2.5-flash}}

ai:
  provider: ${AI_PROVIDER:openrouter}
  api-key: ${AI_API_KEY:${GEMINI_API_KEY:demo-key}}
  base-url: ${AI_BASE_URL:${GEMINI_BASE_URL:https://openrouter.ai/api}}
  model: ${AI_MODEL:${GEMINI_MODEL:google/gemini-2.5-flash}}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:15}

services:
  enrollment:
    url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
    timeout-seconds: ${ENROLLMENT_TIMEOUT_SECONDS:5}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    root: INFO
    com.rikkei.eduportal: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
