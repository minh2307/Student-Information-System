server:
  port: 8083

spring:
  application:
    name: enrollment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academic_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.rikkei.eduportal: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

schedule:
  optimizer:
    max-search-nodes: 50000
    max-execution-time-ms: 3000
    max-solutions: 100

payos:
  client-id: ${PAYOS_CLIENT_ID:demo-client-id}
  api-key: ${PAYOS_API_KEY:demo-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:demo-checksum-key-32bytes-long!!}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/student/tuition?status=PAID}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/student/tuition?status=CANCELLED}

