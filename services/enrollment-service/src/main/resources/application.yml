server:
  port: 8083
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 2000
    accept-count: 200
    connection-timeout: 30000

spring:
  application:
    name: enrollment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academic_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.rikkei.eduportal: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

schedule:
  optimizer:
    max-search-nodes: 50000
    max-execution-time-ms: 3000
    max-solutions: 100

payos:
  client-id: ${PAYOS_CLIENT_ID:57fb1006-9ba1-472c-ba21-8536efcda5aa}
  api-key: ${PAYOS_API_KEY:22f2d865-a236-4f93-9f66-e845a1dae134}
  checksum-key: ${PAYOS_CHECKSUM_KEY:2fcea1152bb41c61979f7011cc5a0e3b72758cc9d14909772595a5268dc9075a}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:https://rikkeiportal.io.vn/student/tuition?status=PAID}
  cancel-url: ${PAYOS_CANCEL_URL:https://rikkeiportal.io.vn/student/tuition?status=CANCELLED}
