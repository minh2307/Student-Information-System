services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d academic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: eduportal-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      LECTURER_SERVICE_URL: http://lecturer-service:8085
      AI_SERVICE_URL: http://ai-service:8084
    depends_on:
      - auth-service
      - course-service
      - enrollment-service
      - lecturer-service
      - ai-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: eduportal-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: eduportal-course
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: eduportal-enrollment
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: eduportal-ai
    ports:
      - "8084:8084"
    environment:
      AI_API_KEY: ${AI_API_KEY:-demo-key}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  lecturer-service:
    build:
      context: .
      dockerfile: services/lecturer-service/Dockerfile
    container_name: eduportal-lecturer
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
