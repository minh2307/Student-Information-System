services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: eduportal-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - course-service
      - enrollment-service
      - ai-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: eduportal-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - postgres

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: eduportal-course
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - postgres

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: eduportal-enrollment
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - postgres

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: eduportal-ai
    ports:
      - "8084:8084"
    environment:
      AI_API_KEY: ${AI_API_KEY:-demo-key}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduportal-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
