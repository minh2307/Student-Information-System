services:
  postgres:
    image: postgres:16-alpine
    container_name: eduportal-postgres
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d academic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: eduportal-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      LECTURER_SERVICE_URL: http://lecturer-service:8085
      AI_SERVICE_URL: http://ai-service:8084
    depends_on:
      - auth-service
      - course-service
      - enrollment-service
      - lecturer-service
      - ai-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: eduportal-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
    depends_on:
      postgres:
        condition: service_healthy

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: eduportal-course
    ports:
      - "${COURSE_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  enrollment-service:
    build:
      context: .
      dockerfile: services/enrollment-service/Dockerfile
    container_name: eduportal-enrollment
    ports:
      - "${ENROLLMENT_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-demo-client-id}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-demo-api-key}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-demo-checksum-key-32bytes-long!!}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:5173/student/tuition?status=PAID}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:5173/student/tuition?status=CANCELLED}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: eduportal-ai
    ports:
      - "${AI_PORT:-8084}:8084"
    environment:
      AI_API_KEY: ${AI_API_KEY:-demo-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1500}
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduportal-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api-gateway

  lecturer-service:
    build:
      context: .
      dockerfile: services/lecturer-service/Dockerfile
    container_name: eduportal-lecturer
    ports:
      - "${LECTURER_PORT:-8085}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
