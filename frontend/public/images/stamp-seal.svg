<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <path id="circlePath1" d="M 90, 90 m -70, 0 a 70,70 0 1,1 140,0 a 70,70 0 1,1 -140,0" />
    <path id="circlePath2" d="M 90, 90 m -50, 0 a 50,50 0 1,0 100,0 a 50,50 0 1,0 -100,0" />
  </defs>
  
  <!-- Outer double ring -->
  <circle cx="90" cy="90" r="82" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="2, 1"/>
  <circle cx="90" cy="90" r="76" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="90" cy="90" r="54" fill="none" stroke="#DC2626" stroke-width="1"/>

  <!-- Curved text around perimeter -->
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="10.5" font-weight="bold" fill="#DC2626" letter-spacing="1.5">
    <textPath href="#circlePath1" startOffset="50%" text-anchor="middle">
      ★ HỌC VIỆN ĐÀO TẠO RIKKEI ★
    </textPath>
  </text>
  
  <!-- Curved text bottom -->
  <text font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#DC2626" letter-spacing="1">
    <textPath href="#circlePath2" startOffset="50%" text-anchor="middle">
      PHÒNG QUẢN LÝ ĐÀO TẠO
    </textPath>
  </text>
  
  <!-- Center Emblem: Star & Confirmed text -->
  <g transform="translate(90, 90)">
    <polygon points="0,-16 4,-5 16,-5 7,2 10,13 0,6 -10,13 -7,2 -16,-5 -4,-5" fill="#DC2626" opacity="0.9"/>
    <text y="24" font-family="'Inter', sans-serif" font-size="7.5" font-weight="900" fill="#DC2626" text-anchor="middle" letter-spacing="1">
      ĐÃ XÁC THỰC
    </text>
  </g>
</svg>
